name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-and-reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Lint
        run: python -m ruff check .
      - name: Test key calculations
        run: python -m pytest -q
      - name: Regenerate synthetic data and analysis
        run: |
          python scripts/generate_synthetic_data.py --output-dir data/generated
          python scripts/run_analysis.py --data-dir data/generated --output-dir reports
          python scripts/render_report.py --metrics reports/metrics.json --quality reports/quality_checks.json --output reports/analysis_report.md
          python scripts/validate_case.py --data-dir data/generated --reports-dir reports
      - name: Execute notebook top to bottom
        run: python -m jupyter nbconvert --execute --to notebook --inplace notebooks/conversion_drop_rca.ipynb --ExecutePreprocessor.timeout=180

